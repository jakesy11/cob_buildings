name: Audit public data access
on:
  push:
    paths: ['.github/workflows/audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public sources
        shell: python
        run: |
          import json, urllib.request, urllib.parse, re
          base="https://services1.arcgis.com/EYzEZbDhXZjURPbP/arcgis/rest/services/"
          def fetch(url, params=None):
              if params: url+="?"+urllib.parse.urlencode(params)
              with urllib.request.urlopen(url,timeout=20) as r: return r.read().decode()
          for name in ["City_Limits","Buildings","City_of_Bellevue_Parcels","Bellevue_Permits"]:
              try:
                  root=base+name+"/FeatureServer"
                  meta=json.loads(fetch(root,{"f":"json"}))
                  print(name,"layers",meta.get("layers"),"error",meta.get("error"),flush=True)
                  layer=root+"/"+str(meta["layers"][0]["id"])
                  meta=json.loads(fetch(layer,{"f":"json"}))
                  print("FIELDS",name,[f["name"] for f in meta.get("fields",[])],flush=True)
                  print("COUNT",name,fetch(layer+"/query",{"f":"json","where":"1=1","returnCountOnly":"true"}),flush=True)
                  sample=json.loads(fetch(layer+"/query",{"f":"geojson","where":"1=1","outFields":"*","resultRecordCount":1,"outSR":4326}))
                  # Do not print parcel/permit records or personal contact data.
                  print("SAMPLE",name,"features",len(sample.get("features",[])),"error",sample.get("error"),flush=True)
                  if name=="City_Limits": print("BOUNDARY",sample.get("features",[{}])[0].get("properties"),flush=True)
                  if name=="City_of_Bellevue_Parcels": print("PARCEL_IDENTIFIERS",[{k:v for k,v in f.get("properties",{}).items() if k in {"LISParcelI","ParcelAFN","ParcelAddr","Jurisdicti"}} for f in sample.get("features",[])],flush=True)
                  if name=="Bellevue_Permits": print("PERMIT_PARCEL_IDENTIFIERS",[{k:v for k,v in f.get("properties",{}).items() if k in {"PARCELNUMBER","SITEADDRESS"}} for f in sample.get("features",[])],flush=True)
              except Exception as e: print("ERROR",name,str(e),flush=True)
          try:
              html=fetch("https://info.kingcounty.gov/assessor/DataDownload/default.aspx")
              print("ASSESSOR_ZIP_LINKS",re.findall(r'href=["'+"'"+r']([^"'+"'"+r']*\.zip[^"'+"'"+r']*)',html,re.I),flush=True)
              print("ASSESSOR_FORM_INPUTS",re.findall(r'<input[^>]+type=["'+"'"+r'](?:checkbox|submit)["'+"'"+r'][^>]*>',html,re.I),flush=True)
          except Exception as e: print("ERROR assessor",str(e),flush=True)

      - name: Inspect acknowledged Assessor downloads
        shell: python
        run: |
          from html.parser import HTMLParser
          import urllib.request, urllib.parse, http.cookiejar, re
          class Form(HTMLParser):
              def __init__(self): super().__init__(); self.values={}; self.checkbox=None; self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="input" and a.get("name"):
                      if a.get("type")=="hidden": self.values[a["name"]]=a.get("value","")
                      if a.get("type")=="checkbox": self.checkbox=a["name"]
                  if tag=="a" and a.get("href"): self.links.append(a["href"])
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          url="https://info.kingcounty.gov/assessor/DataDownload/default.aspx"
          try:
              html=opener.open(url,timeout=20).read().decode()
              form=Form(); form.feed(html)
              if form.checkbox:
                  form.values.update({form.checkbox:"on","__EVENTTARGET":form.checkbox,"__EVENTARGUMENT":""})
                  html=opener.open(url,data=urllib.parse.urlencode(form.values).encode(),timeout=20).read().decode()
              parsed=Form(); parsed.feed(html)
              print("ACKNOWLEDGED_DOWNLOAD_LINKS",[x for x in parsed.links if re.search("zip|download|extract|commercial|apartment",x,re.I)],flush=True)
              print("DOWNLOAD_TEXT",re.sub("<[^>]+>"," ",html)[-16000:],flush=True)
          except Exception as e: print("ACKNOWLEDGEMENT_ERROR",str(e),flush=True)
